# Local development stack. Ports bind to 127.0.0.1 (default credentials).
# Override credentials via infra/.env. `up -d` starts dependencies only; run the
# containerised API with:
#
#     docker compose --profile backend up -d --build

services:
  postgres:
    # Base OS pinned with the volume: a glibc change breaks collation indexes (reindex).
    image: postgres:16.14-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lucnt}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-bookworm
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    # Mailpit: maintained, arm64-native MailHog drop-in.
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    profiles: ["backend"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lucnt}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # Signs JWTs; the example value is accepted only in development.
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_me_before_deploying_lucnt}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
