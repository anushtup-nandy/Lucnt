# Prometheus alerting rules for LUCNT. Not yet wired: load via
# `rule_files: [alerts.yml]`.
groups:
  - name: lucnt-security
    rules:
      # Rate limiter fails open when Redis is unreachable: brute-force protection is off.
      - alert: RateLimiterFailOpen
        expr: increase(lucnt_rate_limiter_fail_open_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rate limiter is failing open ({{ $value }} unmetered requests in 5m)"
          description: >-
            Redis is unreachable from the backend, so requests are being
            admitted without rate limiting (bucket={{ $labels.bucket }}).
            Brute-force protection is disabled until Redis recovers.
