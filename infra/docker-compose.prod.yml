# Deployed stack. Not for local development — use docker-compose.yml.
#
#     docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Only nginx publishes ports; every secret is required (`:?`); Postgres is external
# (managed backups/PITR). Run migrations before rollout:
#
#     docker compose -f docker-compose.prod.yml run --rm migrate

services:
  nginx:
    # Digest is the pin; re-pin with: docker buildx imagetools inspect <tag>
    image: nginx:1.27-bookworm@sha256:6784fb0834aa7dbbe12e3d7471e69c290df3e6ba810dc38b34ae33d3c1c05f7d
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR to the directory holding fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-lucnt-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Never publish 8000: it would bypass TLS, body caps and the /metrics deny.
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>=32 chars, not the committed example)}
      # Exact dashboard origins. Never a wildcard: allow_credentials is on.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the dashboard origin(s)}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # DB connections = workers × (DB_POOL_SIZE + DB_MAX_OVERFLOW); mind max_connections.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness gates nginx; the image HEALTHCHECK stays liveness to avoid restart storms.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-shot schema upgrade from the backend image.
  migrate:
    image: ${BACKEND_IMAGE:-lucnt-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # alembic/env.py builds Settings(), so required settings must be set here too.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>=32 chars, not the committed example)}
    restart: "no"

  redis:
    image: redis:7.4-bookworm@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    # Never publish: Redis has no password.
    expose:
      - "6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Self-hosted Postgres (you own backups). Point DATABASE_URL at `postgres`.
  #
  # postgres:
  #   # Keep the data directory's base OS: a glibc change breaks collation indexes.
  #   image: postgres:16.14-trixie
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB:-lucnt}
  #   expose:
  #     - "5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # Certificate issuance/renewal (opt-in `certs` profile). First issuance, with
  # nginx already serving the ACME webroot on port 80:
  #
  #     docker compose -f docker-compose.prod.yml --profile certs run --rm \
  #       certbot certonly --webroot -w /var/www/certbot \
  #       -d <your-api-hostname> --email <ops-email> --agree-tos --no-eff-email
  #
  # Then point nginx at ${TLS_CERT_DIR}/live/<hostname>/, uncomment HSTS in
  # nginx.conf and reload. Renew with `... run --rm certbot renew` from cron.
  certbot:
    image: certbot/certbot:latest@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    profiles: ["certs"]
    volumes:
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR to the directory holding fullchain.pem and privkey.pem}:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    restart: "no"

# Fixed subnet so nginx `set_real_ip_from` trusts only this network (no XFF forging).
# Change together with nginx.conf (set_real_ip_from and the /metrics allow).
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.100.0/24

volumes:
  certbot_webroot:
  # postgres_data:
