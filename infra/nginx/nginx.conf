# Edge for the LUCNT API: TLS, real client IP (the app rate limiter keys on it),
# body/connection caps, and /metrics denied.
# TO DEPLOY: replace `api.example.com`, mount certificates, and add your load
# balancer CIDR to `set_real_ip_from` (see the warning there).

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Request id lets nginx and backend log lines be joined.
    log_format lucnt '$remote_addr - [$time_iso8601] "$request" $status '
                     '$body_bytes_sent rt=$request_time '
                     'upstream=$upstream_response_time rid="$http_x_request_id"';
    access_log /dev/stdout lucnt;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;

    keepalive_timeout 75s;

    # --- Client → nginx limits ---------------------------------------------
    # Bodies are a few hundred bytes; 256k is generous but stops huge payloads.
    client_max_body_size 256k;
    client_body_timeout  15s;
    client_header_timeout 15s;
    # Slow-read defence.
    send_timeout 30s;

    # --- Rate and connection limits ----------------------------------------
    # Coarse per-IP backstop; per-key limits live in the app.
    limit_req_zone  $binary_remote_addr zone=api_rq:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    upstream lucnt_backend {
        server backend:8000;
        # Reuse upstream connections; must stay below gunicorn's `keepalive = 65`.
        keepalive 32;
    }

    # HTTP only redirects, except ACME challenges for renewal.
    server {
        listen 80;
        server_name api.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS is irreversible for max-age: uncomment only once a real certificate
        # is issued (certbot service in docker-compose.prod.yml).
        # add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # --- Real client IP (rate-limiter prerequisite) -------------------
        # WARNING: list ONLY trusted CIDRs; any range here can forge X-Forwarded-For.
        # Pinned compose subnet (keep in sync with /metrics and the compose file);
        # add your load balancer CIDR at deploy time.
        set_real_ip_from 172.28.100.0/24;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location / {
            limit_req  zone=api_rq burst=200 nodelay;
            limit_conn api_conn 64;

            proxy_pass http://lucnt_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $http_x_request_id;

            # Above the app's 30s statement timeout so Postgres reports the real cause.
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering on;
        }

        # Open for load balancers.
        location = /health/live {
            access_log off;
            proxy_pass http://lucnt_backend;
            proxy_set_header Host $host;
        }

        # /metrics is unauthenticated in the app; scrape from inside the network only.
        location = /metrics {
            allow 172.28.100.0/24;
            deny all;
            access_log off;
            proxy_pass http://lucnt_backend;
            proxy_set_header Host $host;
        }

        # Second lock: the app also disables these outside development.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            deny all;
        }
    }
}
