# Edge configuration for a deployed LUCNT API.
#
# `infra/nginx/` was empty, so the API terminated plaintext HTTP straight off
# uvicorn with no body-size cap and no connection limits. Four jobs here:
#
#  1. **TLS termination.** API keys travel in a header; over plaintext they are
#     readable by anything on the path.
#  2. **`real_ip` — a hard prerequisite for the rate limiter, not a nicety.** The auth-failure
#     rate limiter keys on `request.client.host`. Behind a proxy that is the
#     proxy's own address for *every* caller, so all clients share one bucket and
#     20 failures anywhere lock out everyone. `real_ip_header` is what makes that
#     limiter mean what its docstring claims.
#  3. **Body and connection caps**, so an oversized payload is rejected at the
#     edge instead of occupying a worker thread and a DB connection.
#  4. **`/metrics` is denied**, because the app serves it unauthenticated.
#
# TO DEPLOY: replace `api.example.com`, mount real certificates, and set
# `set_real_ip_from` to your load balancer's actual CIDR — see the warning there.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Log the resolved client address and the app's request id, so an nginx line
    # and the structured backend line for the same request can be joined.
    log_format lucnt '$remote_addr - [$time_iso8601] "$request" $status '
                     '$body_bytes_sent rt=$request_time '
                     'upstream=$upstream_response_time rid="$http_x_request_id"';
    access_log /dev/stdout lucnt;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;

    keepalive_timeout 75s;

    # --- Client → nginx limits ---------------------------------------------
    # Request bodies here are spend instructions: a few hundred bytes, and bounded
    # by the request-schema `max_length` caps. 256k is generous by two orders of magnitude and
    # still stops a multi-megabyte body reaching a worker thread.
    client_max_body_size 256k;
    client_body_timeout  15s;
    client_header_timeout 15s;
    # Slow-read defence: drop a client that cannot absorb a response.
    send_timeout 30s;

    # --- Rate and connection limits ----------------------------------------
    # A coarse edge backstop, NOT a replacement for the app's limiter. This one cannot see
    # API keys, so it can only bound traffic per IP; the per-key and auth-failure
    # buckets stay in the application where the identity is known.
    limit_req_zone  $binary_remote_addr zone=api_rq:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    upstream lucnt_backend {
        server backend:8000;
        # Reuse upstream connections; must stay below gunicorn's `keepalive = 65`.
        keepalive 32;
    }

    # Plain HTTP exists only to redirect. ACME challenges are served first so a
    # certificate renewal is not caught by the redirect.
    server {
        listen 80;
        server_name api.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS: only meaningful once TLS actually works, and irreversible for the
        # max-age window. Keep it commented until the certificate is real.
        # Issuance is wired — run the `certbot` service in
        # docker-compose.prod.yml (`--profile certs`, instructions there) once a
        # production hostname exists, replace `server_name` above, then
        # uncomment this line and reload. That is the entire remaining step.
        # add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # --- Real client IP (rate-limiter prerequisite) -------------------
        # WARNING: `set_real_ip_from` must list ONLY addresses you control. Any
        # range trusted here can forge `X-Forwarded-For` and therefore choose
        # which rate-limit bucket it lands in — including an empty one.
        #
        # This trusts EXACTLY the compose network, whose subnet is pinned
        # in docker-compose.prod.yml (`networks.default.ipam`). The old
        # 172.16.0.0/12 trusted a million-address range. At deploy time add
        # your load balancer's real CIDR as a second line — and no more. Keep
        # this in lockstep with the /metrics allow below and the compose file.
        set_real_ip_from 172.28.100.0/24;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location / {
            limit_req  zone=api_rq burst=200 nodelay;
            limit_conn api_conn 64;

            proxy_pass http://lucnt_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass through a caller's request id, or hand the app the one nginx
            # logged, so the two logs agree on the identifier.
            proxy_set_header X-Request-Id      $http_x_request_id;

            # Above the app's 30s statement timeout so Postgres, not nginx,
            # decides a slow query's fate — a 504 here would hide the real cause.
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering on;
        }

        # Liveness is left open for load balancers; readiness too, since it
        # returns no figures — only up/down and a revision string.
        location = /health/live {
            access_log off;
            proxy_pass http://lucnt_backend;
            proxy_set_header Host $host;
        }

        # The app serves /metrics unauthenticated (see `main.py`). Scrape it from
        # inside the network; never expose it. `deny all` is the second lock, with
        # `METRICS_ENABLED=false` as the first.
        location = /metrics {
            # The pinned compose subnet — same value as set_real_ip_from.
            allow 172.28.100.0/24;
            deny all;
            access_log off;
            proxy_pass http://lucnt_backend;
            proxy_set_header Host $host;
        }

        # `/docs`, `/redoc` and `/openapi.json` are already disabled outside
        # development by `main.py`. Denied here too: two independent locks
        # on the full financial API surface, so one misconfigured ENVIRONMENT
        # cannot publish it.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            deny all;
        }
    }
}
