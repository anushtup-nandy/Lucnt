# gitleaks configuration (T4-2).
#
# Extends the upstream ruleset rather than replacing it — a hand-rolled rule list
# would silently stop detecting whatever upstream adds next.
[extend]
useDefault = true

[allowlist]
description = "Generated knowledge-graph output, which is derived from tracked source"

# `graphify-out/` is `graphify update .` output. It is now gitignored, but
# `gitleaks detect` scans **commit history**, not the working tree — the workflow
# passes `fetch-depth: 0` precisely so a key deleted in a later commit is still
# caught. So untracking the directory does nothing for the ~29 commits that
# already contain it, and this allowlist has to stay.
#
# Two distinct false-positive classes came from here, both `generic-api-key`:
#
#   * `cache/*.json` — maps of file path → content hash. Every hash is a
#     high-entropy hex string. 13 findings.
#   * `graph.json` / `graph.html` / `<date>/graph.json` — node labels, which are
#     graphify's own condensed summaries of source files, not verbatim quotes.
#     6 findings. The flagged string exists in NO tracked file at ANY commit:
#     `docs/PRODUCTION_PLAN.md:410` spreads "API-key brute force", `scan` and
#     `recompute` across a markdown table with backticks and an arrow between
#     them — nothing adjacent, nothing quoted, no match. Compressing them into
#     "(API-key brute force, scan/recompute abuse)" inside a JSON string value is
#     what produced the rule's keyword-then-quoted-value shape.
#
# Widened from `cache/.*\.json$` to the whole directory rather than chasing each
# new label, because you cannot grep your own docs to predict what a summariser
# will emit — that treadmill has no end. The content is derived from files this
# scan already covers, so nothing goes unscanned in substance. Still scoped to
# this one generated directory — a broad `*.json` allowlist would excuse a real
# key in a config file, which is the thing this scan exists to catch.
paths = [
  '''^graphify-out/''',
]

# The same false-positive string, quoted deliberately in `docs/SECURITY.md` as the
# worked example in Lesson 2. That file carries an inline `gitleaks:allow` marker on
# the line, which is the correct narrow suppression — but the marker was added one
# commit too late: `370fc21` had already committed and pushed the unmarked line, and
# `detect` scans history, so the tree being clean does not help. (Lesson 1, demoed on
# itself.) A regex allowlist is the non-destructive fix; the alternative is a
# `filter-repo` rewrite and a force-push of `main`.
#
# Scoped to this one literal, not to `docs/SECURITY.md` as a path — a real key pasted
# into that file must still fail the build.
#
# NOTE: `regexes` is matched against the **secret** gitleaks extracted, not the whole
# line. Here the rule's capture group is exactly `scan/recompute` (entropy 3.52) — the
# surrounding "(API-key brute force, ... abuse)" is only the context that made the
# rule fire. Anchoring to the secret is why this entry is `^scan/recompute$` and not
# the sentence it appears in; a line-level pattern silently matches nothing. Confirm
# any new entry with `gitleaks detect --source=. --verbose` (no `--redact`) and copy
# the `Secret:` field.
regexes = [
  '''^scan/recompute$''',
]
