[project]
name = "lucnt-backend"
version = "0.1.0"
description = "Backend API for the LUCNT platform"
requires-python = ">=3.12"
dependencies = [
    # T4-8: was `fastapi[standard]`, which pulls `fastapi-cli`,
    # `fastapi-cloud-cli` (a deployment client that talks to a third-party
    # service), `rich-toolkit`, `jinja2`, `python-multipart` and
    # `email-validator` into the deployable image. None is imported anywhere in
    # `src/` — no templates, no form parsing, no `EmailStr` — and every
    # documented workflow invokes `uvicorn` directly, never `fastapi dev`. Six
    # fewer packages in the runtime image, one of which makes network calls.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    # Dev/CI convenience: the binary wheel needs no compiler. The IMAGE replaces
    # it with a source build of `psycopg2` (see `Dockerfile`), because the binary
    # wheel bundles its own OpenSSL, which `apt-get upgrade` can never patch.
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # P7.0 dashboard auth. T4-8 removed `python-jose` and `bcrypt` here with
    # standing instructions: "Reinstate them only alongside the auth feature that
    # needs them, and prefer `argon2`/`bcrypt` over `python-jose`, which is thinly
    # maintained." That feature is here, and the instruction is followed —
    # `python-jose` stays out. It pulled in `ecdsa`, whose Minerva timing attack
    # (PYSEC-2026-1325) the maintainers declared out of scope with **no planned
    # fix**, plus three `pyasn1` CVEs: four of the six findings `pip-audit` once
    # reported. `pyjwt` has neither dependency; `argon2-cffi` is memory-hard and
    # is what hashes `users.password_hash`. See `security.py` and
    # `frontend/PLAN.md` §2.
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "uuid6>=2024.1.12",
    "redis>=5.0",
    "prometheus-client>=0.20",
    # Process manager for the deployable image (T4-1). `uvicorn.workers` is
    # deprecated in favour of the separately released `uvicorn-worker`, which is
    # what `infra/gunicorn.conf.py` loads.
    "gunicorn>=22.0",
    "uvicorn-worker>=0.2",
]

[project.optional-dependencies]
# Error reporting is opt-in: with `SENTRY_DSN` unset, `sentry_sdk` is never
# imported. Kept out of the default set so the deployable image carries no
# dependency on a third-party service unless someone deliberately configures one.
sentry = ["sentry-sdk>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "faker>=24.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucnt_api"]

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "B008", # FastAPI Depends() false positive
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["lucnt_api"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N"]

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.engine.*",
    "sqlalchemy.orm.*",
    "sqlalchemy.ext.asyncio.*",
    "sqlalchemy.sql.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
