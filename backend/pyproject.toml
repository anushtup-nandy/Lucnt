[project]
name = "lucnt-backend"
version = "0.1.0"
description = "Backend API for the LUCNT platform"
requires-python = ">=3.12"
dependencies = [
    # Not `fastapi[standard]`: its extras (incl. a cloud CLI) are unused.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    # The Dockerfile swaps this for a source build (bundled OpenSSL is unpatchable).
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # pyjwt, not python-jose (its ecdsa/pyasn1 deps carry unfixed CVEs).
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "uuid6>=2024.1.12",
    "redis>=5.0",
    "prometheus-client>=0.20",
    # `uvicorn.workers` is deprecated in favour of `uvicorn-worker`.
    "gunicorn>=22.0",
    "uvicorn-worker>=0.2",
]

[project.optional-dependencies]
# Opt-in: sentry_sdk is imported only when SENTRY_DSN is set.
sentry = ["sentry-sdk>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "faker>=24.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucnt_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
# ruff ≥0.16 formats markdown code blocks; docs aren't gated code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "B008", # FastAPI Depends() false positive
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["lucnt_api"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.engine.*",
    "sqlalchemy.orm.*",
    "sqlalchemy.ext.asyncio.*",
    "sqlalchemy.sql.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
