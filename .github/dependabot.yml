version: 2

# backend/ is deliberately absent: its hashed requirements.lock is produced by
# `uv pip compile`, which Dependabot cannot regenerate, so every backend PR would
# fail the lockfile gate. Upgrade it by hand (see the CI advisory step).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
