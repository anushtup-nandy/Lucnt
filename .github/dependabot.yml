version: 2

# backend/ omitted: Dependabot can't regenerate its uv-compiled hashed lock.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
