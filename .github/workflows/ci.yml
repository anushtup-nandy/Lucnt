name: CI

# Green CI gate: lint/type/test for every package, migration round-trip, schema
# drift, secret + dependency scans, and a Docker build. Same commands as local.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff · mypy · alembic · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lucnt
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-bookworm
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # TEST_DATABASE_URL is set only on the pytest step: config.py rejects it equal
      # to DATABASE_URL, which the alembic steps repoint at the throwaway DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lucnt
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/lucnt_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      # Required (signs JWTs); the example value is accepted only in development.
      SECRET_KEY: dev_secret_change_me_before_deploying_lucnt
      CORS_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Resolves fresh on purpose (early warning); the image uses requirements.lock.
        run: pip install -e ".[dev]"

      - uses: astral-sh/setup-uv@v5
        with:
          # Default globs match neither `.lock` nor backend/, leaving the cache dead.
          cache-dependency-glob: backend/requirements.lock
      - name: Lockfile is in sync with pyproject.toml
        # Seeded with the committed lock (`uv pip compile` keeps existing pins), so it
        # fires only on real pyproject divergence, not on any new upstream release.
        run: |
          cp requirements.lock /tmp/requirements.check
          uv pip compile pyproject.toml --universal --python-version 3.12 \
            --generate-hashes --quiet -o /tmp/requirements.check
          # uv's header echoes the `-o` path, so drop that line from both sides.
          strip() { sed '/^#    uv pip compile/d' "$1"; }
          if ! diff -u <(strip requirements.lock) <(strip /tmp/requirements.check); then
            echo "::error::requirements.lock no longer satisfies pyproject.toml. Regenerate with:" >&2
            echo "  cd backend && uv pip compile pyproject.toml --universal \\" >&2
            echo "    --python-version 3.12 --generate-hashes -o requirements.lock" >&2
            exit 1
          fi

      - name: Newer dependency versions available (advisory)
        # Reports what `--upgrade` would move; without it compile keeps existing pins.
        continue-on-error: true
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.12 \
            --generate-hashes --upgrade --quiet -o /tmp/requirements.latest
          strip() { sed '/^#    uv pip compile/d' "$1"; }
          if diff -q <(strip requirements.lock) <(strip /tmp/requirements.latest) >/dev/null; then
            echo "requirements.lock is at the newest resolvable version set."
          else
            echo "::warning::Newer dependency versions are available. Upgrade deliberately with:"
            echo "  cd backend && uv pip compile pyproject.toml --universal \\"
            echo "    --python-version 3.12 --generate-hashes --upgrade -o requirements.lock"
            diff -u <(strip requirements.lock) <(strip /tmp/requirements.latest) \
              | grep -E '^[-+][A-Za-z0-9._-]+==' || true
          fi

      - name: Create the test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE lucnt_test'

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/ gunicorn.conf.py alembic/env.py
      - name: Format (ruff format --check)
        run: ruff format --check src/ tests/ scripts/ gunicorn.conf.py alembic/env.py
      - name: Types (mypy)
        run: mypy src/ scripts/ gunicorn.conf.py

      - name: API contract is current
        # A normalized projection, not a byte-diff: raw openapi.json churns with
        # fastapi/pydantic bumps. Verdict codes are open strings, so gated separately.
        run: python scripts/export_contract.py --check

      - name: Migrations round-trip (upgrade → downgrade → upgrade)
        # Throwaway DB only: `downgrade base` drops every table. Alembic reads DATABASE_URL.
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Schema drift (alembic check)
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}
        run: alembic check

      - name: Tests (pytest)
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DB_URL }}
        run: pytest

  backend-image:
    name: backend image (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: lucnt-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert the image does not run as root
        run: |
          uid=$(docker run --rm lucnt-backend:ci id -u)
          echo "image uid: $uid"
          test "$uid" != "0"
      - name: Assert no build toolchain leaked into the runtime stage
        run: |
          if docker run --rm lucnt-backend:ci sh -c 'command -v gcc'; then
            echo "gcc present in runtime image" >&2
            exit 1
          fi

  sdk:
    name: sdk (ruff · mypy · pytest · py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # 3.10 is the SDK's supported floor; 3.12 matches the backend. No fail-fast so
      # each leg reports independently.
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff format --check)
        run: ruff format --check .
      - name: Types (mypy)
        run: mypy src/
      - name: Tests (pytest)
        run: pytest

  frontend:
    name: frontend (oxlint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are current
        # src/types/api.ts must be regenerated whenever the backend contract changes.
        run: |
          npm run gen:types
          git diff --exit-code -- src/types/api.ts
      - name: Lint (oxlint)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm run test
      - name: Build (vite)
        run: npm run build

  security:
    name: security (secrets · dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        # Upstream image: gitleaks-action needs a paid licence for org repos.
        # `--redact` keeps findings out of the public log.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency audit (pip-audit)
        # Audits the hashed lock, i.e. exactly what the image ships.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --require-hashes --desc
