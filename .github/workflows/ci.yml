name: CI

# The repo's mandated "Green CI" gate, enforced on every push/PR:
# ruff + mypy + pytest for both packages, plus an Alembic reversibility round-trip
# and a schema-drift check for the backend. Runs the exact commands used locally
# so CI never diverges.
#
# Beyond lint/type/test, this workflow also runs:
#   * a Redis service — the rate limiter made Redis a real runtime dependency, and a suite
#     that only ever ran with it absent proves the fail-open path and nothing else;
#   * `alembic check`, which is only meaningful now that env.py turns on
#     `compare_type`/`compare_server_default` (it immediately found real drift);
#   * a dedicated TEST_DATABASE_URL, so the destructive downgrade round-trip
#     provably runs somewhere other than the database the suite reads;
#   * secret and dependency scanning;
#   * a Docker build, because an image that only builds on the author's laptop is
#     not a deployable artifact.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff · mypy · alembic · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lucnt
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-bookworm
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # `DATABASE_URL` stays pointed at `lucnt` so the round-trip below cannot be
      # the thing that migrates the database the tests then assert against.
      #
      # `TEST_DATABASE_URL` is deliberately NOT set here — only on the `pytest`
      # step. The validator in `config.py` rejects a config where the two
      # are equal, and the alembic steps below have to point `DATABASE_URL` at
      # the throwaway database; with both in job scope they collide and every
      # `Settings()` construction raises before doing any work. Scoping each var
      # to the steps that actually read it keeps the guard's intent — the
      # *suite's* destructive fixtures must never target the read database —
      # without the two ever being in scope together.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lucnt
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/lucnt_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      # P7.0 made SECRET_KEY required — it signs dashboard JWTs, so an unset one
      # is a startup failure by design (`config.py`). CI is `development`, where
      # the committed example value is accepted.
      SECRET_KEY: dev_secret_change_me_before_deploying_lucnt
      CORS_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Resolves fresh, deliberately: CI is the early-warning system for a
        # dependency that breaks us, while `requirements.lock` keeps the *image*
        # reproducible. The drift check below stops the two diverging silently.
        run: pip install -e ".[dev]"

      - uses: astral-sh/setup-uv@v5
        with:
          # Without this the action warns "No file matched to
          # [**/uv.lock,**/requirements*.txt]. The cache will never get invalidated" —
          # its default globs match neither `requirements.lock` (`.lock`, not `.txt`)
          # nor this job's `backend/` working directory, so the uv cache was dead
          # weight rather than a cache.
          cache-dependency-glob: backend/requirements.lock
      - name: Lockfile is in sync with pyproject.toml
        # Blocking gate: does `requirements.lock` still satisfy what `pyproject.toml`
        # declares? A lock that has genuinely diverged means the image ships something
        # other than what pyproject says, and nothing else in CI would notice.
        #
        # The check is SEEDED with the committed lock (the `cp` below), because
        # `uv pip compile` treats an existing output file as preferences and keeps its
        # pins. Unseeded — as this step was originally written — it resolved fresh from
        # the index on every run, so the gate went red whenever any of ~60 direct or
        # transitive dependencies published a new version, with no change to the repo
        # at all. That is exactly what broke `370fc21`: `fastapi 0.140.7` reached PyPI
        # 44 minutes before the push, and the identical workflow had passed the day
        # before. Seeded, the gate fires only on real divergence — a dependency added
        # to or removed from pyproject, or a constraint the lock's pins no longer
        # satisfy. Verified by injecting a dependency into a throwaway pyproject and
        # confirming the seeded check still catches it.
        #
        # Picking up newer versions is a deliberate act: see the advisory step below.
        run: |
          cp requirements.lock /tmp/requirements.check
          uv pip compile pyproject.toml --universal --python-version 3.12 \
            --generate-hashes --quiet -o /tmp/requirements.check
          # uv's header echoes its own `-o` path, so that one line always differs
          # and is dropped from both sides rather than stripped from the
          # committed file, which stays self-documenting.
          strip() { sed '/^#    uv pip compile/d' "$1"; }
          if ! diff -u <(strip requirements.lock) <(strip /tmp/requirements.check); then
            echo "::error::requirements.lock no longer satisfies pyproject.toml. Regenerate with:" >&2
            echo "  cd backend && uv pip compile pyproject.toml --universal \\" >&2
            echo "    --python-version 3.12 --generate-hashes -o requirements.lock" >&2
            exit 1
          fi

      - name: Newer dependency versions available (advisory)
        # Preserves the early-warning value the blocking gate used to supply, without
        # taxing unrelated pushes. Resolves fresh from the index and reports what a
        # deliberate `--upgrade` would move. Never fails the build.
        #
        # Note `--upgrade` is REQUIRED to see this: a plain
        # `uv pip compile ... -o requirements.lock` over an existing lock preserves its
        # pins, so it is a no-op for version bumps. The old error message told people
        # to run exactly that, which would have shown them an empty diff and sent them
        # back to a still-red build.
        continue-on-error: true
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.12 \
            --generate-hashes --upgrade --quiet -o /tmp/requirements.latest
          strip() { sed '/^#    uv pip compile/d' "$1"; }
          if diff -q <(strip requirements.lock) <(strip /tmp/requirements.latest) >/dev/null; then
            echo "requirements.lock is at the newest resolvable version set."
          else
            echo "::warning::Newer dependency versions are available. Upgrade deliberately with:"
            echo "  cd backend && uv pip compile pyproject.toml --universal \\"
            echo "    --python-version 3.12 --generate-hashes --upgrade -o requirements.lock"
            diff -u <(strip requirements.lock) <(strip /tmp/requirements.latest) \
              | grep -E '^[-+][A-Za-z0-9._-]+==' || true
          fi

      - name: Create the test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE lucnt_test'

      - name: Lint (ruff)
        # `tests/` and the gunicorn config are linted too: the original job only
        # covered `src/`, so a lint error in either was invisible to CI.
        run: ruff check src/ tests/ scripts/ gunicorn.conf.py alembic/env.py
      - name: Format (ruff format --check)
        # Formatting is a gate, not a habit — drift had reached 29 files
        # before this step existed.
        run: ruff format --check src/ tests/ scripts/ gunicorn.conf.py alembic/env.py
      - name: Types (mypy)
        run: mypy src/ scripts/ gunicorn.conf.py

      - name: API contract is current
        # Gates `contracts/api-contract.json` (a normalized projection of every path,
        # field, type, required flag and enum) and `contracts/verdict-codes.json`.
        #
        # A *projection*, not a byte-diff of `openapi.json`, deliberately: the raw
        # document moves with fastapi/pydantic bumps ($ref naming, anyOf ordering,
        # generated titles) with zero repo change — the `370fc21` failure mode.
        #
        # `verdict-codes.json` is separate because `Verdict.code` is an open string
        # on the wire, so `VerdictCode` never reaches OpenAPI, while the SDK
        # branches on the literal "budget_exhausted". No schema gate can see that
        # move; this one can.
        run: python scripts/export_contract.py --check

      - name: Migrations round-trip (upgrade → downgrade → upgrade)
        # Against the throwaway database, deliberately: `downgrade base` drops
        # every table it can reach. Alembic reads `DATABASE_URL` only
        # (`alembic/env.py` imports `settings` at module scope), so pointing it at
        # the throwaway database is the whole mechanism — and why
        # `TEST_DATABASE_URL` must not also be in scope here.
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Schema drift (alembic check)
        # Fails if the models imply a migration nobody wrote. Only sharp now that
        # type and server-default comparison were enabled.
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}
        run: alembic check

      - name: Tests (pytest)
        # The one step that reads `TEST_DATABASE_URL`: `tests/conftest.py` builds
        # its engine from it and warns when it is unset. `DATABASE_URL` keeps the
        # job-level value, so the two differ and the `config.py` validator is satisfied.
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DB_URL }}
        run: pytest

  backend-image:
    name: backend image (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: lucnt-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert the image does not run as root
        # A regression here is silent and serious, so it is asserted rather than
        # trusted to the Dockerfile staying correct.
        run: |
          uid=$(docker run --rm lucnt-backend:ci id -u)
          echo "image uid: $uid"
          test "$uid" != "0"
      - name: Assert no build toolchain leaked into the runtime stage
        run: |
          if docker run --rm lucnt-backend:ci sh -c 'command -v gcc'; then
            echo "gcc present in runtime image" >&2
            exit 1
          fi

  sdk:
    name: sdk (ruff · mypy · pytest · py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # The SDK is a customer-facing library: `requires-python = ">=3.10"` is a
      # promise, so 3.10 stays in the matrix (the floor customers may run) while
      # 3.12 matches the backend's runtime.
      #
      # fail-fast off: a failure on one Python must not cancel the other leg —
      # "does this break on 3.10, 3.12, or both?" is exactly the signal a
      # version matrix exists to give (learned 30 Jul: a format failure on the
      # 3.10 leg cancelled 3.12 and hid whether the failure was version-bound).
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        # The whole tree: `tests-realclient/` and `examples/` are code too —
        # they carry per-file-ignores in pyproject rather than being unlinted.
        run: ruff check .
      - name: Format (ruff format --check)
        run: ruff format --check .
      - name: Types (mypy)
        run: mypy src/
      - name: Tests (pytest)
        run: pytest

  frontend:
    name: frontend (oxlint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are current
        # The backend job gates `contracts/openapi.json` being current; this gates the
        # other half — that `src/types/api.ts` was regenerated from it. Without
        # this, a backend contract change leaves the frontend typed against the
        # old wire format and nothing goes red.
        run: |
          npm run gen:types
          git diff --exit-code -- src/types/api.ts
      - name: Lint (oxlint)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm run test
      - name: Build (vite)
        run: npm run build

  security:
    name: security (secrets · dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        # Run the upstream image rather than `gitleaks/gitleaks-action`, which
        # gates on a paid licence key for organisation-owned repositories.
        # `--redact` keeps any finding out of the public build log. Scans history,
        # not just the tree — a key deleted in a later commit is still leaked.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency audit (pip-audit)
        # Blocking since 30 Jul 2026: the lockfile now pins the whole
        # input set (with hashes), so the audit runs against exactly what the
        # image ships — no fresh resolve, no unrelated-PR flakiness. A CVE in a
        # pinned version is a real fact about the artifact and should be red.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --require-hashes --desc
